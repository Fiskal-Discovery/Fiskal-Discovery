<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="16" height="16" fill="#08000F"/>
  <text x="8" y="12" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" filter="url(#glow)">
    <tspan fill="#FFFFFF">F</tspan><tspan fill="#7E09A5">D</tspan>
  </text>
  <circle cx="8" cy="3" r="1.2" fill="#FFE600" opacity="0.9"/>
  <text x="8" y="3.5" font-family="Arial, sans-serif" font-size="2" fill="#08000F" text-anchor="middle">£</text>
  <!-- Stronger purple glow pulse -->
  <circle cx="8" cy="7.5" r="6" fill="#7E09A5" opacity="0.15"/>
  <circle cx="8" cy="7.5" r="4.5" fill="#7E09A5" opacity="0.2"/>
</svg>
