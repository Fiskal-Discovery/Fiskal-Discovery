<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('fiskal_appState') || '{}');
      if (s.welcomeCompleted) {
        window.location.replace('home.html');
      } else {
        window.location.replace('onboarding.html');
      }
    } catch(e) {
      window.location.replace('onboarding.html');
    }
  </script>
</head>
<body></body>
</html>
