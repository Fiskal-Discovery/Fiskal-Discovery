<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voice Demo</title>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; padding: 30px; max-width: 480px; margin: 0 auto; }
  h2 { color: #FFE600; margin-bottom: 6px; }
  p { color: #aaa; font-size: 13px; margin-bottom: 24px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  button.play { background: #222; border: 1px solid #444; color: #FFE600; border-radius: 50%; width: 38px; height: 38px; font-size: 16px; cursor: pointer; flex-shrink: 0; transition: background .15s; }
  button.play:hover { background: #333; }
  label { font-size: 15px; }
  .controls { margin: 28px 0 18px; display: flex; gap: 18px; flex-wrap: wrap; }
  .ctrl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #aaa; }
  input[type=range] { width: 140px; accent-color: #FFE600; }
  span.val { color: #FFE600; font-weight: bold; }
</style>
</head>
<body>
<h2>Voice SFX Demo</h2>
<p>Adjust pitch &amp; rate, then hit ▶ to preview each booster.</p>

<div class="controls">
  <div class="ctrl">
    Pitch <input type="range" id="pitch" min="0.5" max="2" step="0.05" value="1.1"> <span class="val" id="pitchVal">1.1</span>
  </div>
  <div class="ctrl">
    Rate <input type="range" id="rate" min="0.5" max="2" step="0.05" value="1.2"> <span class="val" id="rateVal">1.2</span>
  </div>
</div>

<div id="list"></div>

<script>
const phrases = [
  'Extra life!',
  'Shield activated!',
  'Cash attract!',
  'Rapid fire!',
  'Double bullets!',
  'Triple bullets!',
  'Slow motion!',
  'Speed boost!',
  'Support ship!',
  'Extra income!',
  'Debt shield!',
  'Personal service!',
  'Bomb ready!',
  'Wave cleared!',
  'Boss incoming!',
  'Overdrive!',
  'Hull breached!',
  'Frozen!',
];

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.pitch = parseFloat(document.getElementById('pitch').value);
  u.rate  = parseFloat(document.getElementById('rate').value);
  u.volume = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

const list = document.getElementById('list');
phrases.forEach(p => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<button class="play" onclick="speak('${p}')">▶</button><label>${p}</label>`;
  list.appendChild(row);
});

['pitch','rate'].forEach(id => {
  const el = document.getElementById(id);
  const val = document.getElementById(id+'Val');
  el.addEventListener('input', () => val.textContent = el.value);
});
</script>
</body>
</html>
