<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voice Demo</title>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; padding: 30px; max-width: 520px; margin: 0 auto; }
  h2 { color: #FFE600; margin-bottom: 6px; }
  p { color: #aaa; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  button.play { background: #222; border: 1px solid #444; color: #FFE600; border-radius: 50%; width: 38px; height: 38px; font-size: 16px; cursor: pointer; flex-shrink: 0; transition: background .15s; }
  button.play:hover { background: #333; }
  label { font-size: 15px; }
  .controls { margin: 0 0 16px; display: flex; gap: 18px; flex-wrap: wrap; }
  .ctrl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #aaa; }
  input[type=range] { width: 130px; accent-color: #FFE600; }
  span.val { color: #FFE600; font-weight: bold; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  button.preset { background: #1a1a1a; border: 1px solid #444; color: #ccc; border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; transition: background .15s; }
  button.preset:hover { background: #2a2a2a; color: #FFE600; border-color: #FFE600; }
  select { background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 5px 8px; border-radius: 6px; font-size: 12px; margin-bottom: 20px; width: 100%; }
</style>
</head>
<body>
<h2>Voice SFX Demo</h2>
<p>Pick a preset or tweak the sliders, then hit ▶</p>

<label style="font-size:12px;color:#aaa">Voice</label>
<select id="voiceSelect"></select>

<div class="presets">
  <button class="preset" onclick="applyPreset(0.4, 0.85)">🤖 Deep Retro</button>
  <button class="preset" onclick="applyPreset(0.5, 1.0)">👾 Arcade</button>
  <button class="preset" onclick="applyPreset(0.6, 1.3)">⚡ Punchy</button>
  <button class="preset" onclick="applyPreset(1.1, 1.2)">🔊 Normal</button>
</div>

<div class="controls">
  <div class="ctrl">
    Pitch <input type="range" id="pitch" min="0.1" max="2" step="0.05" value="0.4"> <span class="val" id="pitchVal">0.4</span>
  </div>
  <div class="ctrl">
    Rate <input type="range" id="rate" min="0.5" max="2" step="0.05" value="0.85"> <span class="val" id="rateVal">0.85</span>
  </div>
</div>

<div id="list"></div>

<script>
const phrases = [
  'Extra life!',
  'Shield activated!',
  'Cash attract!',
  'Rapid fire!',
  'Double bullets!',
  'Triple bullets!',
  'Slow motion!',
  'Speed boost!',
  'Support ship!',
  'Extra income!',
  'Debt shield!',
  'Personal service!',
  'Bomb ready!',
  'Wave cleared!',
  'Boss incoming!',
  'Overdrive!',
  'Hull breached!',
  'Frozen!',
];

let voices = [];

function populateVoices() {
  voices = speechSynthesis.getVoices();
  const sel = document.getElementById('voiceSelect');
  sel.innerHTML = '';
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.name} (${v.lang})`;
    // default to first English voice
    if (v.lang.startsWith('en') && sel.selectedIndex === -1) sel.value = i;
    sel.appendChild(opt);
  });
}

speechSynthesis.onvoiceschanged = populateVoices;
populateVoices();

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.pitch  = parseFloat(document.getElementById('pitch').value);
  u.rate   = parseFloat(document.getElementById('rate').value);
  u.volume = 0.9;
  const idx = parseInt(document.getElementById('voiceSelect').value);
  if (voices[idx]) u.voice = voices[idx];
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function applyPreset(pitch, rate) {
  document.getElementById('pitch').value = pitch;
  document.getElementById('rate').value  = rate;
  document.getElementById('pitchVal').textContent = pitch;
  document.getElementById('rateVal').textContent  = rate;
}

const list = document.getElementById('list');
phrases.forEach(p => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<button class="play" onclick="speak('${p}')">▶</button><label>${p}</label>`;
  list.appendChild(row);
});

['pitch','rate'].forEach(id => {
  const el  = document.getElementById(id);
  const val = document.getElementById(id+'Val');
  el.addEventListener('input', () => val.textContent = el.value);
});
</script>
</body>
</html>
