<script>
'use strict';
(function(){
  const sf=document.getElementById('starfield');
  const c=document.createElement('canvas');
  c.style.cssText='width:100%;height:100%;display:block;';
  sf.appendChild(c);
  const sctx=c.getContext('2d');
  let stars=[];
  function initStars(){
    c.width=window.innerWidth;
    c.height=window.innerHeight;
    stars=Array.from({length:160},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.2,s:Math.random()*0.5+0.1,o:Math.random()*0.85+0.15}));
  }
  function drawStars(){
    sctx.clearRect(0,0,c.width,c.height);
    stars.forEach(st=>{st.y+=st.s;if(st.y>c.height){st.y=0;st.x=Math.random()*c.width;}sctx.beginPath();sctx.arc(st.x,st.y,st.r,0,Math.PI*2);sctx.fillStyle='rgba(255,255,255,'+st.o+')';sctx.fill();});
    requestAnimationFrame(drawStars);
  }
  initStars();drawStars();window.addEventListener('resize',()=>{document.body.classList.toggle('playing-mobile',!!G&&window.innerWidth<=520);if(G&&!G.dead){canvas.width=Math.min(window.innerWidth,720);const headerH=document.body.classList.contains('playing-mobile')?0:document.querySelector('.fiskal-header').offsetHeight;canvas.height=Math.max(300,window.innerHeight-headerH-document.getElementById('hud').offsetHeight-2);if(G.player){G.player.x=Math.max(G.player.w/2,Math.min(canvas.width-G.player.w/2,G.player.x));G.player.y=canvas.height-40}}});

})();
</script>

      company: String(entry.company || entry.businessName || "N/A").toUpperCase().slice(0, 32),
      score: Number(entry.score) || 0,
      wave: Number(entry.wave) || 1,
      timestamp: Number(entry.timestamp) || 0
    };
  }

  function makeKey(entry) {
    return (entry.name + "_" + entry.company)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "_")
      .replace(/^_+|_+$/g, "");
  }

  function dedupeAndSort(rawEntries) {
    const bestByPlayer = {};

    rawEntries
      .filter(Boolean)
      .map(normaliseEntry)
      .forEach(entry => {
        const key = makeKey(entry);
        const existing = bestByPlayer[key];

        if (
          !existing ||
          entry.score > existing.score ||
          (entry.score === existing.score && entry.timestamp > existing.timestamp)
        ) {
          bestByPlayer[key] = entry;
        }
      });

    return Object.values(bestByPlayer)
      .sort((a, b) => b.score - a.score)
      .slice(0, 10);
  }

  if (!db) {
    const localRows = dedupeAndSort(getLocalLB());
    console.log("FINAL LOCAL ROWS BEING RENDERED:", JSON.stringify(localRows));
    renderRows(localRows);
    return Promise.resolve(localRows);
  }

  console.log("READING FROM:", "scores");

  return db.ref("scores").once("value")
    .then(snapshot => {
      const snapshotVal = snapshot.val() || {};
      console.log("FULL SNAPSHOT VAL:", snapshotVal);

      const rawEntries = Object.values(snapshotVal);
      console.log("RAW ENTRIES:", rawEntries);

      const finalRows = dedupeAndSort(rawEntries);
      console.log("FINAL FIREBASE ROWS BEING RENDERED:", JSON.stringify(finalRows));

      renderRows(finalRows);
      return finalRows;
    })
    .catch(err => {
      console.warn("Firebase renderLB failed, using localStorage fallback", err);
      const localRows = dedupeAndSort(getLocalLB());
      renderRows(localRows);
      return localRows;
    });
}

}

ctx.fillStyle='#FF4400';ctx.shadowColor='#FF4400';ctx.shadowBlur=8;G.bossBlasts.forEach(b=>ctx.fillRect(b.x-3,b.y-10,6,18));ctx.shadowBlur=0;G.powerups.forEach(item=>{ctx.save();ctx.globalAlpha=.85+Math.sin(item.pulse)*.15;ctx.font='bold 11px "Press Start 2P",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#00FF88';ctx.shadowColor='#00FF88';ctx.shadowBlur=18;const lh=17,total=item.pu.lines.length*lh;item.pu.lines.forEach((line,i)=>ctx.fillText(line,item.x,item.y-total/2+lh/2+i*lh));ctx.restore()});
